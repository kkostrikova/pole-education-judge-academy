name: Supabase Keepalive

on:
  schedule:
    # Three small database requests per day (UTC).
    - cron: "17 1,9,17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-keepalive.yml"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Keep Supabase project active
        env:
          SUPABASE_URL: https://mffjcqpyfcptwahpxeom.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_G69GdUkmDVVZcAVUhLT9Mw_pADiXZOs
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "$SUPABASE_URL/rest/v1/rpc/pe_keepalive")"

          echo "$response" | jq -e '.ok == true' >/dev/null
          echo "Supabase keepalive succeeded."
