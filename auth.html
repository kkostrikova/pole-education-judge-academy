<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вхід · Pole Education Judge Academy</title><link rel="stylesheet" href="auth.css?v=20260829-certlang1"></head><body>
<div class="shell"><div class="panel">
<section class="visual"><div><div class="mark">PE</div><div class="mini" style="margin-top:24px">JUDGE ACADEMY</div><h1>Особистий кабінет судді</h1><p>Зареєструйтесь, щоб зберігати навчальний прогрес, результати тестів і фінальну сертифікацію.</p></div><div><a href="index.html">← Повернутися до платформи</a></div></section>
<section class="formwrap">
<button class="btn google-btn" id="googleAuthBtn" type="button" aria-label="Продовжити з Google"><span class="google-mark">G</span><span>Продовжити з Google</span></button>
<div class="auth-divider"><span>або через email</span></div>
<div class="tabs"><button class="tab active" data-tab="login">Увійти</button><button class="tab" data-tab="signup">Зареєструватися</button></div>
<form id="loginForm">
<label><span>Email</span><input class="field" type="email" id="loginEmail" required autocomplete="email"></label>
<label><span>Пароль</span><input class="field" type="password" id="loginPassword" required autocomplete="current-password"></label>
<button class="btn primary" type="submit">Увійти</button></form>
<form id="signupForm" class="hidden">
<div class="grid2"><label><span>Ім’я та прізвище</span><input class="field" id="signupName" required></label><label><span>Країна</span><input class="field" id="signupCountry" required></label></div>
<label><span>Email</span><input class="field" type="email" id="signupEmail" required autocomplete="email"></label>
<label><span>Пароль</span><input class="field" type="password" id="signupPassword" minlength="8" required autocomplete="new-password"></label>
<button class="btn primary" type="submit">Створити акаунт</button></form>
<div id="authMessage" class="message" style="margin-top:16px">Для входу використовуйте email, який ви підтвердили.</div>
</section></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="auth.js?v=20260829-nda1"></script></body></html>
